name: Deploy to GitHub Pages

# MANUAL ONLY, on purpose (changed 2026-08-27, mirrors MARANATHA's 2026-08-26
# fix). The push trigger fired a full build-and-publish on every commit to
# main, and pushing to main is this repo's normal workflow for every
# ordinary change -- so every ordinary change was also a deploy, 63 of them
# this month alone. To publish: Actions tab -> "Deploy to GitHub Pages" ->
# Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Publishable key, safe in a public repo/workflow, gated by RLS
          # server-side. Configured as repo Variables, not Secrets.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
