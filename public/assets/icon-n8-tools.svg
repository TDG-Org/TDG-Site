<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="N8-Tools">
  <!-- N8-Tools has no icon of its own yet, so this is one drawn in the same
       house style as VidHelper's: the same rounded tile and TDG gradient, with
       a beamed pair of notes for the music and sound work the app is for. The
       beam is deliberately heavy, because the mark is read at 30px. -->
  <defs>
    <linearGradient id="n8ToolsTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#b06dff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28.16" fill="url(#n8ToolsTile)"/>
  <g fill="#fff">
    <path d="M51 30L100 20V36L51 46Z"/>
    <rect x="51" y="40" width="9" height="54"/>
    <rect x="91" y="32" width="9" height="54"/>
    <ellipse cx="42" cy="94" rx="15.5" ry="11.5" transform="rotate(-20 42 94)"/>
    <ellipse cx="82" cy="86" rx="15.5" ry="11.5" transform="rotate(-20 82 86)"/>
  </g>
</svg>
