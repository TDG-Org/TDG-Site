<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MVTrade">
  <!-- MVTrade's own app mark, taken from the geometry in its repo
       (ui/assets/logo.svg): a dark tile with a gradient frame, a faceted
       diamond, and the gold rule under it. The only change is the framing —
       the source draws its tile inset inside a 96 box, and every icon in this
       folder is trimmed to its own art and squared, so here the tile fills the
       square and the radius is the 0.22 the site's own tiles carry
       (AppIcon.css). -->
  <!-- The diamond and core gradients are userSpaceOnUse and are painted
       inside the group below, so their coordinates are the source file's own,
       untransformed. Only the frame's are in this file's box. -->
  <defs>
    <linearGradient id="mvtradeFrame" x1="12" y1="11" x2="116" y2="117" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e6b2"/>
      <stop offset=".52" stop-color="#45b8bf"/>
      <stop offset="1" stop-color="#b487d6"/>
    </linearGradient>
    <linearGradient id="mvtradeDiamond" x1="24" y1="14" x2="73" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efffff"/>
      <stop offset=".28" stop-color="#8ff3ff"/>
      <stop offset=".64" stop-color="#31bdd7"/>
      <stop offset="1" stop-color="#246aa6"/>
    </linearGradient>
    <linearGradient id="mvtradeCore" x1="35" y1="23" x2="64" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfffff"/>
      <stop offset=".52" stop-color="#55d7e5"/>
      <stop offset="1" stop-color="#1f7fc0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28.16" fill="#0a1417"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="25.66" fill="none" stroke="url(#mvtradeFrame)" stroke-width="5"/>
  <g transform="translate(-7.04 -7.04) scale(1.48)">
    <path d="M25 18h46l14 18-37 45-37-45 14-18Z" fill="#061f27"/>
    <path d="M27 20h42l13 17-34 41-34-41 13-17Z" fill="url(#mvtradeDiamond)"/>
    <path d="M27 20h13l-8 17H14l13-17Z" fill="#dcffff"/>
    <path d="M40 20h16l-6 17H32l8-17Z" fill="#a7fbff"/>
    <path d="M56 20h13l13 17H50l6-17Z" fill="#65e2f4"/>
    <path d="M14 37h18l16 41-34-41Z" fill="#37bdd9"/>
    <path d="M32 37h18L48 78 32 37Z" fill="url(#mvtradeCore)"/>
    <path d="M50 37h32L48 78l2-41Z" fill="#247fc0"/>
    <path d="M26 58h44v6H26z" fill="#e6ffff" opacity=".18"/>
    <path d="M23 78h50" stroke="#e0a43b" stroke-width="5" stroke-linecap="square"/>
  </g>
</svg>
