<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ── the NAME, and it is not the same string as the share card's ──────
         This is what a bookmark is saved as and what a Home Screen tile is
         labelled, on every platform: Safari's Add Bookmark pre-fills from
         <title>, and iOS falls back to it for a web clip when nothing more
         specific is offered. It used to read "TDG · The Disciples of God",
         which is the lockup rather than the name — so the site arrived on a
         phone called something no list of our apps calls it.

         The lockup is not gone; it is on the share card below, where a
         headline is what is wanted. A tab, a bookmark and an icon want a
         NAME.

         The name is "TDG Cebu" as of 2026-08-31, and it was "TDG Site" before
         that. The REPO is still TDG-Site and the site is still served from
         /TDG-Site/, so the two are no longer the same word and neither is a
         place to read the other from: the path is an address and this is what
         the site is CALLED. Every app of ours that names it says "TDG Cebu"
         too — AGENTS.md rule 18. -->
    <title>TDG Cebu</title>
    <meta
      name="description"
      content="Brothers building software, games, and tools for the glory of Jesus."
    />
    <!-- Said again for the two surfaces that will not read <title>: iOS reads
         apple-mobile-web-app-title for the Home Screen label (and the manifest's
         short_name after it), Windows reads application-name for a pinned site.
         All four say "TDG Cebu" — see AGENTS.md rule 18. -->
    <meta name="apple-mobile-web-app-title" content="TDG Cebu" />
    <meta name="application-name" content="TDG Cebu" />

    <!-- ── the ICON, and why a vector is not enough on its own ──────────────
         favicon.svg is theme-aware and stays the browser tab's icon. Safari
         will not read an SVG for apple-touch-icon, though, so with only that
         link an iPhone built its Home Screen tile out of a SCREENSHOT of this
         page. icons/ holds the raster family: opaque, square, no baked corner
         radius, the mark inside the 80% every platform mask agrees is safe.
         scripts/icons.mjs draws them all from CrossGlyph's own path. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- display is "browser" on purpose. A standalone web app on iOS keeps its
         own storage and sends every out-of-scope navigation to Safari — which
         is exactly what sign-in does, since signInWithOAuth leaves for the
         provider and comes back. Installed standalone, the round trip would
         land the session in Safari and leave the tile still signed out. The
         icon and the name are what this file is fixing; the browser stays. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ONE theme-color, driven by the site's own toggle rather than by a
         `media` query on the OS scheme. Two metas keyed on
         prefers-color-scheme followed the OS, so a visitor who chose light
         here on a dark phone read a pale page under a black browser bar. The
         boot script below sets it from the stored choice before first paint,
         and ThemeProvider rewrites it from the live `--bg` on every toggle.
         The two literals here mirror `--bg` in src/styles/tokens.css — the one
         place a `<head>` cannot read a token from, because no stylesheet has
         loaded when it is parsed. -->
    <meta name="theme-color" content="#07070a" />
    <meta name="color-scheme" content="dark light" />
    <!-- This page ships its own light and dark scenes, so a "dark mode"
         extension has nothing to add and a great deal to take away. The lock
         is the documented way to say so; see src/lib/chromeGuard.ts for the
         rest of the defence. -->
    <meta name="darkreader-lock" />

    <!-- Share cards. og:image must be absolute, because a crawler has no page
         to resolve a relative one against, so these carry the deployed origin.
         Change all four if the site ever moves to a custom domain. -->
    <link rel="canonical" href="https://tdg-org.github.io/TDG-Site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TDG · The Disciples of God" />
    <meta property="og:title" content="TDG · The Disciples of God" />
    <meta
      property="og:description"
      content="Brothers building software, games, and tools for the glory of Jesus."
    />
    <meta property="og:url" content="https://tdg-org.github.io/TDG-Site/" />
    <meta property="og:image" content="https://tdg-org.github.io/TDG-Site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The TDG landing page" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TDG · The Disciples of God" />
    <meta
      name="twitter:description"
      content="Brothers building software, games, and tools for the glory of Jesus."
    />
    <meta name="twitter:image" content="https://tdg-org.github.io/TDG-Site/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the page actually sets. Cormorant 500 + italic 400,
         Space Grotesk 600/700, Manrope 300–700, JetBrains Mono 500/600. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Space+Grotesk:wght@600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong scene.
      try {
        var t = localStorage.getItem('tdg-theme')
        var light = t === 'light'
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
        var tc = document.querySelector('meta[name="theme-color"]')
        if (tc) tc.setAttribute('content', light ? '#f6f6f8' : '#07070a')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        .noscript {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: #07070a;
          color: #f2f2f5;
          font: 400 16px/1.7 'Manrope', system-ui, sans-serif;
          text-align: center;
        }
        .noscript h1 {
          margin: 0 0 12px;
          font: 500 56px 'Cormorant Garamond', Georgia, serif;
          letter-spacing: -0.012em;
        }
        .noscript p {
          margin: 0 auto;
          max-width: 40ch;
          color: rgba(242, 242, 245, 0.6);
        }
        .noscript a {
          color: #b9b9c4;
        }
      </style>
      <div class="noscript">
        <div>
          <h1>✝ TDG</h1>
          <p>
            Brothers building software, games, and tools for the glory of Jesus.
            <br /><br />
            This page needs JavaScript. The rest of our work is on
            <a href="https://github.com/TDG-Org">GitHub</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
